- type: entity
  id: BulletAdvPlasmaCutter
  name: advanced cutter bolt
  parent: BulletPlasmaCutter
  description: Now that's bad. Get out of the way.
  components:
  - type: GatheringProjectile
    amount: 40
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Heat: 15
  - type: StaminaDamageOnCollide
    damage: 40
  - type: TimedDespawn
    lifetime: 0.5
  - type: PointLight
    radius: 2
    color: purple
    energy: 1

- type: entity
  id: BulletAdvPlasmaCutterStrong
  parent: BulletAdvPlasmaCutter
  components:
  - type: GatheringProjectile
  - type: Projectile
    damage:
      types:
        Heat: 25
        Structural: 200
  - type: TimedDespawn
    lifetime: 0.5
  - type: PointLight
    radius: 4
    color: purple
    energy: 2
