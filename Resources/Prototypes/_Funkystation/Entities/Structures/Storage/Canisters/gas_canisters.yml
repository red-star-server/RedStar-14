- type: entity
  parent: GasCanister
  id: HydrogenCanister
  name: hydrogen canister
  description: A canister that contains hydrogen. It can be attached to connector ports using a wrench.
  components:
  - type: Sprite
    sprite: _Funkystation/Structures/Storage/canister.rsi
    layers:
    - state: hydrogen
  - type: GasCanister
    gasMixture:
      volume: 1000
      moles:
      - 0 # oxygen
      - 0 # nitrogen
      - 0 # CO2
      - 0 # Plasma
      - 0 # Tritium
      - 0 # Water vapor
      - 0 # Ammonia
      - 0 # N2O
      - 0 # Frezon
      - 0 # BZ
      - 0 # Healium
      - 0 # Nitrium
      - 0 # Pluoxium
      - 1871.71051 # Hydrogen
      - 0 # Hyper-Noblium
      - 0 # Proto-Nitrate
      - 0 # Zauker
      - 0 # Halon
      - 0 # Helium
      - 0 # Anti-Noblium
      temperature: 293.15
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger { damage: 600 }
      behaviors:
      - !type:DoActsBehavior { acts: [ "Destruction" ] }
    - trigger: !type:DamageTrigger { damage: 300 }
      behaviors:
      - !type:PlaySoundBehavior { sound: { collection: MetalBreak } }
      - !type:SpawnEntitiesBehavior
        spawn:
          HydrogenCanisterBroken: { min: 1, max: 1 }
      - !type:DoActsBehavior { acts: [ "Destruction" ] }
      - !type:DumpCanisterBehavior

