name: Update REUSE Headers

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  update_headers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get Changed Files and PR Info
        id: changed_files
        env:
           PR_BODY: ${{ github.event.pull_request.body }}
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           GH_REPO: ${{ github.repository }}
           PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          PR_FILES_JSON=$(curl -s -f -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${GH_REPO}/pulls/${PR_NUMBER}/files")

          PR_FILES=$(echo "$PR_FILES_JSON" | jq -r '.[] | select(.filename != null) | "\(.status) \(.filename)"' || echo "")

          ADDED=$(echo "$PR_FILES" | grep "^added" | grep -E '\.(cs|ya?ml)$' | sed 's/^added //' | xargs || echo "")
          MODIFIED=$(echo "$PR_FILES" | grep "^modified" | grep -E '\.(cs|ya?ml)$' | sed 's/^modified //' | xargs || echo "")

          echo "ADDED_FILES_LIST<<EOF" >> $GITHUB_ENV
          echo "$ADDED" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "MODIFIED_FILES_LIST<<EOF" >> $GITHUB_ENV
          echo "$MODIFIED" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if grep -q "LICENSE: MIT" <<< "$PR_BODY"; then
            echo "PR_LICENSE=mit" >> $GITHUB_ENV
          elif grep -q "LICENSE: MPL" <<< "$PR_BODY"; then
            echo "PR_LICENSE=mpl" >> $GITHUB_ENV
          else
            echo "PR_LICENSE=agpl" >> $GITHUB_ENV
          fi

      - name: Run REUSE Header Update Script
        run: |
          python Tools/update_pr_reuse_headers.py \
            --files-added "${{ env.ADDED_FILES_LIST }}" \
            --files-modified "${{ env.MODIFIED_FILES_LIST }}" \
            --pr-license "${{ env.PR_LICENSE }}" \
            --pr-base-sha "${{ github.event.pull_request.base.sha }}" \
            --pr-head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Automatically update REUSE headers"
          commit_user_name: ${{ vars.CHANGELOG_USER || 'github-actions[bot]' }}
          commit_user_email: ${{ vars.CHANGELOG_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
          commit_author: "${{ vars.CHANGELOG_USER || 'github-actions[bot]' }} <${{ vars.CHANGELOG_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}>"
          skip_dirty_check: false
          skip_fetch: true
